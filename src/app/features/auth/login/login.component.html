<main class="auth-page">
  <section class="auth-card">
    <div class="brand">FlowBoard</div>
    <h1>Welcome back</h1>
    <p>Sign in to continue managing your boards.</p>

    <button class="google-button" type="button" (click)="continueWithGoogle()">
      <span class="google-icon" aria-hidden="true">G</span>
      <span>Continue with Google</span>
    </button>

    <div class="auth-divider"><span>or</span></div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Email</label>
      <input type="email" formControlName="email" autocomplete="email">
      <small *ngIf="form.controls.email.touched && form.controls.email.invalid">Enter a valid email.</small>

      <label>Password</label>
      <input type="password" formControlName="password" autocomplete="current-password">
      <small *ngIf="form.controls.password.touched && form.controls.password.invalid">Password is required.</small>

      <label class="check"><input type="checkbox" formControlName="remember"> Remember me</label>
      <div class="error" *ngIf="error">{{ error }}</div>

      <button class="primary" type="submit" [disabled]="loading">
        <app-spinner *ngIf="loading" label="Signing in"></app-spinner>
        <span *ngIf="!loading">Login</span>
      </button>
    </form>
    <a routerLink="/register">Create an account</a>
  </section>
</main>
