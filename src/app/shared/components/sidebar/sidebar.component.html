<aside class="sidebar" [class.collapsed]="collapsed">
  <button class="collapse-btn" type="button" (click)="collapsed = !collapsed" [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline *ngIf="!collapsed" points="15 18 9 12 15 6"/>
      <polyline *ngIf="collapsed" points="9 18 15 12 9 6"/>
    </svg>
  </button>

  <nav class="nav-section">
    <a class="nav-link" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </a>
    <a class="nav-link" routerLink="/notifications" routerLinkActive="active">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span>Notifications</span>
    </a>
  </nav>

  <div class="section-label">
    <span>Workspaces</span>
  </div>
  <div class="ws-list">
    <a *ngFor="let workspace of workspaces()" class="nav-link workspace-link" [routerLink]="['/workspace', workspace.workspaceId]" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <span class="ws-dot" [style.background]="'hsl(' + (workspace.workspaceId * 47 % 360) + ', 65%, 55%)'"></span>
      <span class="ws-name">{{ workspace.name }}</span>
      <span class="ws-badge" *ngIf="workspace.visibility === 'PUBLIC' && !collapsed">PUB</span>
    </a>
  </div>
  <div class="sidebar-empty" *ngIf="!workspaces().length && !collapsed">
    <span>No workspaces yet</span>
  </div>
</aside>
